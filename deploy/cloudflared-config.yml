# Template for /etc/cloudflared/config.yml
# Replace <TUNNEL_ID> with the ID printed by `cloudflared tunnel create luminoserver`.

tunnel: <TUNNEL_ID>
credentials-file: /root/.cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: luminoserver.com
    service: http://localhost:80
  - hostname: www.luminoserver.com
    service: http://localhost:80
  - service: http_status:404
